<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vunrablity — workspace</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◍</text></svg>">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.8l7.2 3v5.4c0 4.6-3.1 8.6-7.2 10.2-4.1-1.6-7.2-5.6-7.2-10.2V5.8z"/><path d="M8.8 12.1l2.2 2.2 4.2-4.4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.4 11.2l16.9-7.5a.6.6 0 01.8.8l-7.5 16.9a.6.6 0 01-1.1-.05L10 15.2a1 1 0 00-.6-.6l-6.1-2.4a.6.6 0 01-.05-1.1z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M6.5 9.5l3 2.6-3 2.6"/><path d="M12.5 15h5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 2.8H7a2.2 2.2 0 00-2.2 2.2v14a2.2 2.2 0 002.2 2.2h10a2.2 2.2 0 002.2-2.2V8.5z"/><path d="M13.5 2.8v5.7h5.7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.2A2.2 2.2 0 015.2 5h3.4l2 2.6h8.2A2.2 2.2 0 0121 9.8v7.4a2.2 2.2 0 01-2.2 2.2H5.2A2.2 2.2 0 013 17.2z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 6.4l11.2 11.2"/><path d="M17.6 6.4L6.4 17.6"/></symbol>
    <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3.2v11.6"/><path d="M7.4 10.6l4.6 4.6 4.6-4.6"/><path d="M4.2 20.2h15.6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19.2 12H4.8"/><path d="M10.6 5.8L4.4 12l6.2 6.2"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9.2 3.8a2.9 2.9 0 00-2.9 2.9 2.9 2.9 0 00-1.9 4.9 2.9 2.9 0 001 4.9 2.9 2.9 0 003.8 2.9z"/><path d="M14.8 3.8a2.9 2.9 0 012.9 2.9 2.9 2.9 0 011.9 4.9 2.9 2.9 0 01-1 4.9 2.9 2.9 0 01-3.8 2.9z"/><path d="M12 4v16"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8l11.2 6.6a.7.7 0 010 1.2L7.5 19.2a.7.7 0 01-1-.6V5.4a.7.7 0 011-.6z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16.4 3.9a1.9 1.9 0 012.7 2.7L8.4 17.3l-3.6 1 1-3.6z"/><path d="M14.6 5.7l3.7 3.7"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M4.8 4.8h11l4.2 4.2v10.2a1 1 0 01-1 1H4.8a1 1 0 01-1-1V5.8a1 1 0 011-1z"/><path d="M8 4.8v5h7v-5"/><path d="M8 20v-5.6h8V20"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M3.2 12h17.6"/><path d="M12 3.2a14 14 0 010 17.6 14 14 0 010-17.6z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 2.6l8.4 4.4v9.4L12 20.8 3.6 16.4V7z"/><path d="M3.6 7L12 11.4 20.4 7"/><path d="M12 11.4v9.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M20 20l-4.4-4.4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.4 12s3.5-6.2 9.6-6.2S21.6 12 21.6 12s-3.5 6.2-9.6 6.2S2.4 12 2.4 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.4 12a8.4 8.4 0 11-2.6-6.1"/><path d="M20.4 4.2v5.2h-5.2"/></symbol>
  </defs>
</svg>

<div class="shell">
  <!-- ------------------------------------------------------------ sidebar -->
  <aside class="side" id="side">
    <div class="side-head">
      <div class="row">
        <a href="/" class="btn btn-icon" title="New scan">
          <svg class="icon"><use href="#i-back"/></svg>
        </a>
        <svg class="icon"><use href="#i-shield"/></svg>
        <h1>Vunrablity</h1>
      </div>
      <div class="target" id="sideTarget">loading…</div>
    </div>

    <div class="verdict" id="verdictBox" hidden>
      <div class="risk">
        <span class="sev" id="riskChip">—</span>
        <span class="tiny dim" id="filesRead"></span>
      </div>
      <p id="verdictText"></p>
    </div>

    <div class="coverage" id="coverageBox" hidden>
      <div class="coverage-head">
        <svg class="icon" style="width:12px;height:12px"><use href="#i-brain"/></svg>
        <span id="coverageTitle">AI coverage</span>
      </div>
      <div class="coverage-bar"><i id="coverageFill"></i></div>
      <div class="coverage-rows" id="coverageRows"></div>
    </div>

    <div class="counts" id="counts"></div>

    <div class="findings" id="findings">
      <div class="empty">Loading findings…</div>
    </div>

    <div class="side-foot">
      <button class="btn" id="filesBtn">
        <svg class="icon"><use href="#i-folder"/></svg> Files
      </button>
      <button class="btn" id="termBtn">
        <svg class="icon"><use href="#i-terminal"/></svg> Shell
      </button>
      <button class="btn" id="previewBtn">
        <svg class="icon"><use href="#i-eye"/></svg> Preview
      </button>
      <a class="btn" id="reportBtn" download>
        <svg class="icon"><use href="#i-dl"/></svg> Report
      </a>
    </div>
  </aside>

  <!-- ------------------------------------------------------------ main -->
  <main class="main">
    <header class="main-head">
      <div class="who">
        <svg class="icon icon-lg"><use href="#i-shield"/></svg>
        <div>
          <h2>Workspace</h2>
          <div class="sub" id="headSub">—</div>
        </div>
      </div>
      <div class="head-actions">
        <div class="sbx" id="sbxPill" title="Sandbox status — click to open a shell">
          <i class="dot"></i><span id="sbxLabel">sandbox idle</span>
        </div>
      </div>
    </header>

    <div class="stream" id="stream">
      <div class="stream-inner" id="streamInner"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="chips" id="chips">
          <button class="chip">Read everything</button>
          <button class="chip">What's the most dangerous issue here?</button>
          <button class="chip">Serve the site so I can click through it</button>
          <button class="chip">Add a contact page to the site</button>
          <button class="chip">Fix the XSS in the search page</button>
        </div>
        <div class="composer-box glass">
          <textarea id="input" rows="1"
            placeholder="Ask a question, or tell me to build, run, or check something…"></textarea>
          <button class="btn btn-primary btn-icon" id="sendBtn" title="Send">
            <svg class="icon"><use href="#i-send"/></svg>
          </button>
        </div>
        <div class="foot">
          <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          <span id="modelLabel"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ------------------------------------------------------------ drawer -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div style="min-width:0">
      <h3 id="drawerTitle">—</h3>
      <div class="path mono" id="drawerPath"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-icon" id="editBtn" title="Edit this file" hidden>
        <svg class="icon"><use href="#i-edit"/></svg>
      </button>
      <button class="btn btn-icon" id="saveBtn" title="Save" hidden>
        <svg class="icon"><use href="#i-save"/></svg>
      </button>
      <span class="saved-flash" id="savedFlash"></span>
      <button class="btn btn-icon" id="drawerClose" title="Close">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/static/js/highlight.js"></script>
<script src="/static/js/markdown.js"></script>
<script src="/static/js/chat.js"></script>
</body>
</html>
